env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    row.num = 100
    schema = {
      columns = [
        {
          name = id
          type = int
        },
        {
          name = vec
          type = "array<float>"
          nullable = false
          options = {
            length = 10
          }
        }
      ]
    }
  }
}

transform {
  VectorDimensionReduction {
    vector_fields = ["vec"]
    source_dimension = 10
    target_dimension = 5
    reduction_method = "SPARSE_RANDOM_PROJECTION"
  }
}

sink {
  Assert {
    rules = {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 100
        },
        {
          rule_type = MAX_ROW
          rule_value = 100
        }
      ]
      field_rules = [
        {
          field_name = id
          field_type = int
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = vec
          field_type = "float_vector"
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}

